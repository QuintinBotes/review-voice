name: Review Voice
description: Evidence-backed pull request review that posts only verified findings, and stays silent when nothing qualifies.
author: QuintinBotes
branding:
  icon: git-pull-request
  color: purple
inputs:
  mode:
    description: Cost mode (auto, fast, standard or thorough).
    default: auto
  post:
    description: Post the review to the pull request. Also needs writes.github_posting_enabled in the repository config.
    default: 'false'
  anthropic-api-key:
    description: Anthropic API key, for provider anthropic. With no key and no OAuth token the action skips.
    required: false
    default: ''
  claude-code-oauth-token:
    description: Claude Code OAuth token from claude setup-token, for provider anthropic in place of an API key.
    required: false
    default: ''
  provider:
    description: Where the model runs (anthropic, bedrock, vertex or foundry). A cloud provider reads the credentials an earlier step, such as its OIDC login action, put in the job's environment; with none the action skips.
    default: anthropic
  github-token:
    description: Token used to read the pull request and, when posting, to author the review.
    default: ${{ github.token }}
  claude-code-version:
    description: Version of @anthropic-ai/claude-code to install.
    default: 2.1.319
  config:
    description: Repository config file, as a repository-relative path. It is read from the pull request's base commit, never from the checked-out head. For a file outside the repository, set REVIEW_VOICE_CONFIG to its absolute path in the job's env.
    default: .review-voice/config.yaml
  fail-open:
    description: When the review is unavailable on a change assessed as low risk (failure mode failed_open), pass the job instead of failing it. A failed_closed review fails the job whatever this says.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Refuse pull_request_target on the pull request head
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" = "pull_request_target" ]; then
          head_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$head_sha" ] && [ "$(git rev-parse HEAD)" = "$head_sha" ]; then
            echo "::error::Refusing to run under pull_request_target with the pull request head checked out: that runs untrusted code with secrets. Use the pull_request event."
            exit 1
          fi
        fi

    - name: Decide whether to run
      id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        API_KEY: ${{ inputs.anthropic-api-key }}
        OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        PROVIDER: ${{ inputs.provider }}
      run: |
        skip() {
          echo "skip=true" >> "$GITHUB_OUTPUT"
          # In the log too, or a green skip reads as a review that ran (#533).
          echo "Review Voice skipped: $1" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        }
        case "$EVENT_NAME" in
          pull_request | pull_request_target) pr=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH") ;;
          # A review asked for by someone who may dispatch the workflow, which
          # GitHub allows only with write access (#551, #543).
          workflow_dispatch)
            pr=$(jq -r '.inputs.pr // empty' "$GITHUB_EVENT_PATH")
            if ! [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::Review Voice: a workflow_dispatch review needs a pr input holding the pull request number."
              exit 2
            fi
            ;;
          *) skip "not a pull request event." ;;
        esac
        # A cloud provider's credential is whatever its login step exported; the
        # gate only looks for one, so a fork run, which gets none, skips (#544).
        case "${PROVIDER:-anthropic}" in
          anthropic) [ -n "${API_KEY:-}${OAUTH_TOKEN:-}" ] || skip "no Anthropic API key or Claude Code OAuth token is available (fork pull requests receive no secrets)." ;;
          bedrock) [ -n "${AWS_ACCESS_KEY_ID:-}${AWS_BEARER_TOKEN_BEDROCK:-}${AWS_PROFILE:-}${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ] || skip "no Amazon Bedrock credential is available: none of AWS_ACCESS_KEY_ID, AWS_BEARER_TOKEN_BEDROCK, AWS_PROFILE or AWS_WEB_IDENTITY_TOKEN_FILE is set (fork pull requests receive no secrets or OIDC token)." ;;
          vertex) [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || skip "no Google Cloud credential is available: GOOGLE_APPLICATION_CREDENTIALS is not set (fork pull requests receive no secrets or OIDC token)." ;;
          foundry) [ -n "${ANTHROPIC_FOUNDRY_API_KEY:-}${AZURE_CLIENT_ID:-}" ] || skip "no Microsoft Foundry credential is available: neither ANTHROPIC_FOUNDRY_API_KEY nor AZURE_CLIENT_ID is set (fork pull requests receive no secrets or OIDC token)." ;;
          *) echo "::error::The provider input must be anthropic, bedrock, vertex or foundry."; exit 2 ;;
        esac
        if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
          if ! jq -e '(.pull_request.head.repo.full_name // "" | ascii_downcase) as $head
            | (.repository.full_name // "" | ascii_downcase) as $base
            | $head != "" and $head == $base' "$GITHUB_EVENT_PATH" >/dev/null; then
            skip "a fork or unavailable head repository needs a maintainer workflow dispatch."
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "pr=$pr" >> "$GITHUB_OUTPUT"

    - if: steps.gate.outputs.skip != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22

    - if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

    - if: steps.gate.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/review-voice
        # Per pull request: a repository-wide prefix lets two pull requests
        # reviewed at once restore the same store and each save one without the
        # other's records (#509). The second key is for a pull request's first
        # run, which starts from the newest store of any pull request. The
        # attempt is in the key, or a rerun restores the first attempt's store
        # and never saves its own, so what it posted is forgotten (#541).
        key: review-voice-${{ github.repository }}-pr${{ steps.gate.outputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          review-voice-${{ github.repository }}-pr${{ steps.gate.outputs.pr }}-
          review-voice-${{ github.repository }}-

    - name: Review
      id: review
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        PROVIDER: ${{ inputs.provider }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_VOICE_DATA_DIR: ${{ runner.temp }}/review-voice
        PR: ${{ steps.gate.outputs.pr }}
        EVENT_NAME: ${{ github.event_name }}
        MODE: ${{ inputs.mode }}
        POST: ${{ inputs.post }}
        CONFIG: ${{ inputs.config }}
        FAIL_OPEN: ${{ inputs.fail-open }}
        # This job is a check run on the head, still running when the verdict
        # reads CI, so it would keep CI pending for every review (#508). Empty
        # where GitHub does not give the job its check run id.
        REVIEW_VOICE_OWN_CHECK_RUN: ${{ job.check_run_id }}
      run: |
        export REVIEW_VOICE_ACTION_TRIGGER="$EVENT_NAME"
        # The provider is the provider input alone, never a variable left in the
        # job's env (#544). An empty credential is unset, not passed empty, since
        # an empty one can still take its slot in Claude Code's precedence.
        unset CLAUDE_CODE_USE_BEDROCK CLAUDE_CODE_USE_VERTEX CLAUDE_CODE_USE_FOUNDRY CLAUDE_CODE_USE_MANTLE
        case "${PROVIDER:-anthropic}" in
          bedrock) export CLAUDE_CODE_USE_BEDROCK=1 ;;
          vertex) export CLAUDE_CODE_USE_VERTEX=1 ;;
          foundry) export CLAUDE_CODE_USE_FOUNDRY=1 ;;
        esac
        if [ "${PROVIDER:-anthropic}" = anthropic ]; then
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
        else
          unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          # A model the provider does not serve fails the stage, with its reason
          # in the log, instead of switching to another model mid-review.
          export CLAUDE_CODE_DISABLE_MODEL_ACCESS_FALLBACK=1
        fi
        mkdir -p "$REVIEW_VOICE_DATA_DIR"
        args=(review --pr "$PR" --repository "$GITHUB_REPOSITORY" --mode "$MODE" --origin action --json)
        [ "$POST" = "true" ] && args+=(--post)
        base_sha=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
        # A dispatched review has no pull request in its event, so the pull
        # request is read from the API. One from a fork is reviewed from its
        # diff and files with no configured command run, so no code the fork
        # wrote runs with this job's secrets (#543).
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if ! pull=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/pulls/$PR"); then
            echo "::error::Review Voice: could not read pull request $PR of $GITHUB_REPOSITORY."
            exit 2
          fi
          base_sha=$(jq -r '.base.sha // empty' <<<"$pull")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<<"$pull")
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "$head_repo")" != "$(lower "$GITHUB_REPOSITORY")" ]; then
            export REVIEW_VOICE_NO_COMMANDS=1
            echo "Review Voice: pull request $PR comes from a fork, so no configured command runs on its code." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          [ "$(jq -r '.inputs.full // empty' "$GITHUB_EVENT_PATH")" = "true" ] && args+=(--full)
        fi
        # The default path needs nothing here: review --pr reads it from the base
        # commit itself. Another path is read from the base commit too, never from
        # the checked-out head, which the pull request's author controls (S01,
        # ADR 0031). Only a plain repository-relative spelling is accepted, so no
        # path is resolved on disk, where a link, a case alias or a parent
        # component could reach the head's copy. A file outside the repository
        # is set through an absolute REVIEW_VOICE_CONFIG in the job's env.
        if [ "$CONFIG" != ".review-voice/config.yaml" ]; then
          rel="${CONFIG#./}"
          plain=no
          if [[ "$rel" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]] && [[ "$rel" != */ ]]; then
            case "/$rel/" in */../* | */./* | *//*) ;; *) plain=yes ;; esac
          fi
          if [ "$plain" != "yes" ]; then
            echo "::error::The config input must be a repository-relative path such as ci/review-voice.yaml, with no . or .. component. For a file outside the repository, set REVIEW_VOICE_CONFIG to its absolute path in the job's env."
            exit 2
          fi
          if [ -z "$base_sha" ] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::error::The pull request's base commit is not in the clone, so the config input cannot be read from it. Check out with fetch-depth: 0."
            exit 2
          fi
          trusted="$RUNNER_TEMP/review-voice-config.yaml"
          (umask 077 && : > "$trusted")
          if git cat-file -e "${base_sha}:${rel}" 2>/dev/null; then
            git show "${base_sha}:${rel}" > "$trusted"
          else
            echo "Review Voice: $rel is not in the base commit, so the review used the built-in defaults." >> "$GITHUB_STEP_SUMMARY"
          fi
          args+=(--config "$trusted")
        fi
        report="$REVIEW_VOICE_DATA_DIR/report.json"
        set +e
        node "$GITHUB_ACTION_PATH/plugins/review-voice/dist/review-voice.mjs" "${args[@]}" > "$report"
        code=$?
        set -e
        # One line in the log, so a short green job reads as a review that ran
        # and not as a skip. Only the verdict event and numbers: nothing from the
        # pull request reaches it.
        jq -r 'if type == "object" then "Review Voice: verdict \(.verdict.event // .verdict.action // "none"), \((.findings // []) | length) findings, \((.held // []) | length) held, review posted \(.posted == true), cost $\(.costUsd // "n/a") in \(.seconds // "n/a") s" else empty end' "$report" 2>/dev/null || true
        {
          echo "## Review Voice"
          if jq -e . "$report" > /dev/null 2>&1; then
            jq -r '"Verdict: \(.verdict.event // .verdict.action // "none")", "Findings: \((.findings // []) | length) posted, \((.held // []) | length) held", "Posted: \(.posted // false)\(if .carried then " (carried)" else "" end)", "Review: \(.reviewUrl // "n/a")", "Mode: \(.plan.mode // "n/a")", "Cost: $\(.costUsd // "n/a") in \(.seconds // "n/a") s"' "$report"
            echo
            echo '<details><summary>Report</summary>'
            echo
            echo '```json'
            cat "$report"
            echo '```'
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        # Why the review stopped, in the log as well as the summary, so a failed
        # job says it without opening the summary. One line, capped, and escaped
        # for the workflow command, so text from the review cannot start another.
        reason=$(jq -r 'if type == "object" and (.error | type) == "string" then .error | split("\n")[0] | .[0:500] | gsub("%"; "%25") | gsub("\r"; "%0D") else empty end' "$report" 2>/dev/null || true)
        if [ -n "$reason" ]; then echo "::error::Review Voice: $reason"; fi
        # A review that stood but was not posted (posting off at the base commit, issue 507) says so the same way.
        jq -r 'if type == "object" and (.notes | type) == "array" then .notes[] | select(type == "string" and startswith("not posted: ")) | split("\n")[0] | .[0:500] | gsub("%"; "%25") | gsub("\r"; "%0D") | "::warning::Review Voice: \(.)" else empty end' "$report" 2>/dev/null || true
        # In the log too, or the verdict line above reads as a review that failed to post (#533).
        case "$code" in
          3) echo "Review Voice: the head moved during the review; a newer run covers it." | tee -a "$GITHUB_STEP_SUMMARY"; code=0 ;;
          4 | 6) echo "Review Voice: the review ran, but CI is pending or needs a rerun, so its verdict was not posted." | tee -a "$GITHUB_STEP_SUMMARY"; code=0 ;;
        esac
        # A refusal in the post stage leaves a note and no error, so without this
        # the log shows only the help hint for exit 2 (#507). Only when the job
        # still fails, and escaped like the reason above.
        if [ -z "$reason" ] && [ "$code" != 0 ]; then
          note=$(jq -r 'if type == "object" and (.notes | type) == "array" then [.notes[] | strings | select(test("^(post|verdict) exited [0-9]+: "))] | last // empty | split("\n")[0] | .[0:500] | gsub("%"; "%25") | gsub("\r"; "%0D") else empty end' "$report" 2>/dev/null || true)
          if [ -n "$note" ]; then echo "::error::Review Voice: $note"; fi
        fi
        # S03: a review that could not run on a low-risk change may pass the job
        # when the workflow opts in; a high-risk or unassessed one never does.
        # Only one well-formed report saying failed_open can pass the job; a report
        # that does not parse keeps the review's own exit code.
        # Parsed strictly: jq accepts NaN and Infinity, which no review writes.
        if [ "$FAIL_OPEN" = "true" ] && node -e '
          const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
          const ok = report !== null && typeof report === "object" && !Array.isArray(report) && report.failure?.mode === "failed_open";
          process.exit(ok ? 0 : 1);
        ' -- "$report" > /dev/null 2>&1; then
          echo "Review Voice: the review was unavailable on a low-risk change (failed_open); passing." >> "$GITHUB_STEP_SUMMARY"
          code=0
        fi
        exit "$code"
