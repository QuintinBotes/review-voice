name: Review Voice
description: Evidence-backed pull request review that posts only verified findings, and stays silent when nothing qualifies.
author: QuintinBotes
branding:
  icon: git-pull-request
  color: purple
inputs:
  mode:
    description: Cost mode (auto, fast, standard or thorough).
    default: auto
  post:
    description: Post the review to the pull request. Also needs writes.github_posting_enabled in the repository config.
    default: 'false'
  anthropic-api-key:
    description: Anthropic API key. When empty the action skips.
    required: false
    default: ''
  github-token:
    description: Token used to read the pull request and, when posting, to author the review.
    default: ${{ github.token }}
  claude-code-version:
    description: Version of @anthropic-ai/claude-code to install.
    default: 2.1.319
  config:
    description: Repository config file, as a repository-relative path. It is read from the pull request's base commit, never from the checked-out head. For a file outside the repository, set REVIEW_VOICE_CONFIG to its absolute path in the job's env.
    default: .review-voice/config.yaml
  fail-open:
    description: When the review is unavailable on a change assessed as low risk (failure mode failed_open), pass the job instead of failing it. A failed_closed review fails the job whatever this says.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Refuse pull_request_target on the pull request head
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" = "pull_request_target" ]; then
          head_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$head_sha" ] && [ "$(git rev-parse HEAD)" = "$head_sha" ]; then
            echo "::error::Refusing to run under pull_request_target with the pull request head checked out: that runs untrusted code with secrets. Use the pull_request event."
            exit 1
          fi
        fi

    - name: Decide whether to run
      id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        skip() {
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Review Voice skipped: $1" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }
        case "$EVENT_NAME" in pull_request | pull_request_target) ;; *) skip "not a pull request event." ;; esac
        [ -n "$API_KEY" ] || skip "no Anthropic API key is available (fork pull requests receive no secrets)."
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "pr=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"

    - if: steps.gate.outputs.skip != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22

    - if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

    - if: steps.gate.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/review-voice
        key: review-voice-${{ github.repository }}-${{ github.run_id }}
        restore-keys: review-voice-${{ github.repository }}-

    - name: Review
      id: review
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_VOICE_DATA_DIR: ${{ runner.temp }}/review-voice
        PR: ${{ steps.gate.outputs.pr }}
        MODE: ${{ inputs.mode }}
        POST: ${{ inputs.post }}
        CONFIG: ${{ inputs.config }}
        FAIL_OPEN: ${{ inputs.fail-open }}
      run: |
        mkdir -p "$REVIEW_VOICE_DATA_DIR"
        args=(review --pr "$PR" --repository "$GITHUB_REPOSITORY" --mode "$MODE" --origin action --json)
        [ "$POST" = "true" ] && args+=(--post)
        # The default path needs nothing here: review --pr reads it from the base
        # commit itself. Another path is read from the base commit too, never from
        # the checked-out head, which the pull request's author controls (S01,
        # ADR 0031). Only a plain repository-relative spelling is accepted, so no
        # path is resolved on disk, where a link, a case alias or a parent
        # component could reach the head's copy. A file outside the repository
        # is set through an absolute REVIEW_VOICE_CONFIG in the job's env.
        if [ "$CONFIG" != ".review-voice/config.yaml" ]; then
          rel="${CONFIG#./}"
          plain=no
          if [[ "$rel" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]] && [[ "$rel" != */ ]]; then
            case "/$rel/" in */../* | */./* | *//*) ;; *) plain=yes ;; esac
          fi
          if [ "$plain" != "yes" ]; then
            echo "::error::The config input must be a repository-relative path such as ci/review-voice.yaml, with no . or .. component. For a file outside the repository, set REVIEW_VOICE_CONFIG to its absolute path in the job's env."
            exit 2
          fi
          base_sha=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$base_sha" ] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::error::The pull request's base commit is not in the clone, so the config input cannot be read from it. Check out with fetch-depth: 0."
            exit 2
          fi
          trusted="$RUNNER_TEMP/review-voice-config.yaml"
          (umask 077 && : > "$trusted")
          if git cat-file -e "${base_sha}:${rel}" 2>/dev/null; then
            git show "${base_sha}:${rel}" > "$trusted"
          else
            echo "Review Voice: $rel is not in the base commit, so the review used the built-in defaults." >> "$GITHUB_STEP_SUMMARY"
          fi
          args+=(--config "$trusted")
        fi
        report="$REVIEW_VOICE_DATA_DIR/report.json"
        set +e
        node "$GITHUB_ACTION_PATH/plugins/review-voice/dist/review-voice.mjs" "${args[@]}" > "$report"
        code=$?
        set -e
        {
          echo "## Review Voice"
          if jq -e . "$report" > /dev/null 2>&1; then
            jq -r '"Verdict: \(.verdict.event // .verdict.action // "none")", "Findings: \((.findings // []) | length) posted, \((.held // []) | length) held", "Posted: \(.posted // false)\(if .carried then " (carried)" else "" end)", "Review: \(.reviewUrl // "n/a")", "Mode: \(.plan.mode // "n/a")", "Cost: $\(.costUsd // "n/a") in \(.seconds // "n/a") s"' "$report"
            echo
            echo '<details><summary>Report</summary>'
            echo
            echo '```json'
            cat "$report"
            echo '```'
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        # Why the review stopped, in the log as well as the summary, so a failed
        # job says it without opening the summary. One line, capped, and escaped
        # for the workflow command, so text from the review cannot start another.
        reason=$(jq -r 'if type == "object" and (.error | type) == "string" then .error | split("\n")[0] | .[0:500] | gsub("%"; "%25") | gsub("\r"; "%0D") else empty end' "$report" 2>/dev/null || true)
        if [ -n "$reason" ]; then echo "::error::Review Voice: $reason"; fi
        case "$code" in
          3) echo "Review Voice: the head moved during the review; a newer run covers it." >> "$GITHUB_STEP_SUMMARY"; code=0 ;;
          4 | 6) echo "Review Voice: CI is pending or needs a rerun, so no review was posted." >> "$GITHUB_STEP_SUMMARY"; code=0 ;;
        esac
        # S03: a review that could not run on a low-risk change may pass the job
        # when the workflow opts in; a high-risk or unassessed one never does.
        # Only one well-formed report saying failed_open can pass the job; a report
        # that does not parse keeps the review's own exit code.
        # Parsed strictly: jq accepts NaN and Infinity, which no review writes.
        if [ "$FAIL_OPEN" = "true" ] && node -e '
          const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
          const ok = report !== null && typeof report === "object" && !Array.isArray(report) && report.failure?.mode === "failed_open";
          process.exit(ok ? 0 : 1);
        ' -- "$report" > /dev/null 2>&1; then
          echo "Review Voice: the review was unavailable on a low-risk change (failed_open); passing." >> "$GITHUB_STEP_SUMMARY"
          code=0
        fi
        exit "$code"
