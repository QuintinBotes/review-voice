name: Feature request
description: Suggest a change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Review Voice is deliberately narrow. Before filing, please check the
        non-goals in [docs/PLAN.md](../blob/main/docs/PLAN.md) — features that
        turn this into a general review platform are usually out of scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today. Not the solution — the problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: precision
    attributes:
      label: Effect on precision
      description: Would this make Review Voice say more, or say better? More is usually the wrong direction.
