name: Eval

# Agent behaviour evals cost real tokens, so they do not run on every push.
# Nightly, plus on demand via the `run-eval` label or a manual dispatch.
on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  eval:
    name: plugin eval
    # This job holds an API key. A pull request from a fork runs code the
    # maintainer has not reviewed, so it must never reach that key - a label is
    # not a substitute for trust. Fork PRs are evaluated by checking the branch
    # out locally instead.
    if: >
      (github.event_name != 'pull_request') ||
      (github.event.label.name == 'run-eval' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Claude Code
        # Pinned deliberately: an unpinned global install is a mutable
        # dependency running in CI with this repository's tokens, which is the
        # same problem SHA-pinning the actions solves. Bump it consciously.
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin eval plugins/review-voice --eval-dir evals --trust-plugin

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results
          path: evals/**/results*.json
          if-no-files-found: ignore
