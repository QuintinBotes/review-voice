name: Scorecard

# OSSF Scorecard grades this repository's supply-chain posture.
#
# Results are kept as a build artifact rather than uploaded to code scanning.
# Three of Scorecard's high-severity checks - Code-Review, Maintained and
# Branch-Protection - cannot be satisfied by a single-maintainer repository,
# and as code-scanning alerts they blocked every pull request from merging.
# A permanent blocker that nobody can clear trains people to dismiss alerts by
# reflex, which costs more than the visibility was worth. The findings that
# CAN be acted on still appear in the job output.
#
# Revisit the upload when there is a second maintainer; see
# docs/REPO-SECURITY.md.
on:
  branch_protection_rule:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      # Needed by the action to read branch protection and workflow settings.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the public dashboard would need a repo token with
          # broader scope; the security tab is enough for this project.
          publish_results: false

      - name: Summarise findings
        if: always()
        run: |
          echo '## OSSF Scorecard' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('results.sarif') as handle:
              sarif = json.load(handle)
          results = sarif['runs'][0].get('results', [])
          if not results:
              print('No findings.')
          for result in results:
              print(f"- **{result.get('ruleId')}** - {result.get('message', {}).get('text', '').strip()}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: warn
