name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs opt into more, none currently need to.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full matrix on every event. Actions minutes are free and unlimited for
  # public repositories, so the cost argument for trimming this away no longer
  # applies. Review Voice runs on developer machines, most of them macOS, and
  # node:sqlite is the component most likely to behave differently per platform
  # - so this is coverage worth having on the pull request rather than after
  # the merge.
  verify:
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor; 24 is where node:sqlite is no longer experimental.
        node: ['22', '24']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave the workflow token in .git/config where any later
          # step - or any dependency it runs - could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Committed bundle matches source
        run: npm run check:dist

      - name: Identity guard
        run: npm run guard:identity

      - name: Actions are pinned to commit SHAs
        run: npm run check:pins

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install Claude Code
        # Pinned deliberately: an unpinned global install is a mutable
        # dependency running in CI with this repository's tokens, which is the
        # same problem SHA-pinning the actions solves. Bump it consciously.
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Validate plugin manifest
        run: claude plugin validate plugins/review-voice --strict

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate commands, agents and skills
        run: |
          claude plugin validate plugins/review-voice/commands --strict
          claude plugin validate plugins/review-voice/agents --strict
          claude plugin validate plugins/review-voice/skills --strict

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request, gitleaks enumerates the PR's commits to scope the
      # scan, which needs read access to pull requests. Read only - it has no
      # business writing anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fixtures are meant to be synthetic. This is the backstop, not the rule.
      # .gitleaks.toml carries one narrowly scoped exception; see the comment
      # in that file for why it exists and what it does not cover.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The exit code is the signal. The artifact upload and the pull
          # request comment are not worth what they cost: the upload consumes
          # artifact quota, and the comment needs `pull-requests: write`, which
          # would hand a third-party action write access on an event triggered
          # by contributors. A scan that found nothing should not fail because
          # it could not annotate the pull request.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # CONTRIBUTING.md asks for Conventional Commits, so the PR title - which
      # becomes the squash commit message - is checked rather than trusted.
      # Done inline to avoid taking on another third-party action.
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\([a-z0-9 ,/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix: reject candidates without evidence'."
            echo "Got: $TITLE"
            exit 1
          fi
          echo "OK: $TITLE"

  # Single stable gate for branch protection. Matrix job names change whenever
  # the matrix changes; this one does not, so required-check configuration does
  # not silently stop matching.
  ci-green:
    name: ci-green
    runs-on: ubuntu-latest
    needs: [verify, manifests, secrets, conventions]
    if: always()
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: $RESULTS"
          for result in $RESULTS; do
            # 'skipped' is legitimate: the conventions job only runs on PRs.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job did not succeed ($result)."; exit 1 ;;
            esac
          done
