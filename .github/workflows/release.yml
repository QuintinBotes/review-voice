name: Release

on:
  push:
    tags: ['review-voice--v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify everything before publishing a tag
        run: npm run verify

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Manifest and marketplace agree on version
        run: claude plugin validate . --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#review-voice--v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "review-voice v${version}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
