name: Release

on:
  push:
    tags: ['review-voice--v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release. Nothing else is granted.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify everything before publishing a tag
        run: npm run verify

      - name: Install Claude Code
        # Pinned deliberately: an unpinned global install is a mutable
        # dependency running in CI with this repository's tokens, which is the
        # same problem SHA-pinning the actions solves. Bump it consciously.
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Manifest and marketplace agree on version
        run: claude plugin validate . --strict

      - name: Tag points at a commit that is on main
        run: |
          # A release tag must describe reviewed history. If the tagged commit
          # is not an ancestor of main, it bypassed branch protection.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Refusing to release."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#review-voice--v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "review-voice v${version}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
